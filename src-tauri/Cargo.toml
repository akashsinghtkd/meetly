[package]
name = "ai-meeting-recorder"
version = "0.1.0"
description = "AI Meeting Recorder — Notion-style meeting notes"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Durable app state. `bundled` compiles SQLite in, so there's no dependency on
# whatever version the host OS ships.
rusqlite = { version = "0.32", features = ["bundled"] }

# Audio capture
cpal = "0.15"
hound = "3.5"           # WAV encoding
chrono = { version = "0.4", features = ["serde"] }

# HTTP (transcription API calls happen in Rust to avoid CORS + keep keys native)
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json", "rustls-tls"] }

# winreg: read the CapabilityAccessManager consent store to detect mic use.
# windows + raw-window-handle: give the overlay pill non-activating, always-on-top
# behaviour so it floats over full-screen calls — the analog of the macOS NSPanel.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"

# Raw AppKit/AVFoundation access: overlay window level + mic authorization.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"

[features]
# This feature is used for production builds or when a dev server is not specified,
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
