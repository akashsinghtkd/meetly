name: Build

# Compile the Tauri app on the platforms it ships to, so a change that only
# breaks one OS (e.g. the Windows-only overlay code, which can't be compiled
# from a Mac) is caught here instead of on a user's machine. Runs on GitHub's
# hosted runners — free for this repo.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the older in-flight run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # `tauri build` runs the frontend build (beforeBuildCommand) itself.
      # --no-bundle compiles the binary but skips installer packaging/signing,
      # which is all we need to verify the code builds on each OS.
      - name: Build (compile only, no installer)
        run: npm run tauri -- build --no-bundle

  # Real installer build + publish. Manual only (never on every push) so it
  # doesn't build/upload a fresh artifact on each commit. Windows can't be
  # cross-compiled from the Mac (C deps need MSVC), so this is the only way
  # to produce a real Windows installer.
  release-windows:
    if: github.event_name == 'workflow_dispatch'
    name: release-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installer
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run tauri -- build

      - name: Upload to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/upload-build.mjs windows
